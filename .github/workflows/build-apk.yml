name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm install -D @capacitor/core @capacitor/cli @capacitor/android @capacitor/preferences

      - name: Build web app
        run: npm run web:build

      - name: Init Capacitor
        run: npx cap init LaPrimitivaApp com.divad33.laprimitiva --web-dir dist

      - name: Add Android
        run: npx cap add android

      - name: Fix Kotlin duplicates
        run: |
          cd android/app
          sed -i '/dependencies {/a\    configurations.all {\n        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n    }' build.gradle


      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: la-primitiva-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
